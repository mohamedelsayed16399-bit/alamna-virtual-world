<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b2340">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%234dabf7'/%3E%3Ccircle cx='32' cy='26' r='10' fill='%23ffd43b'/%3E%3Crect x='18' y='38' width='28' height='18' rx='9' fill='%2351cf66'/%3E%3C/svg%3E">
<title>عالمنا | عالم افتراضي اجتماعي</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#101830;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.pill{background:rgba(16,24,48,.72);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
#top{position:fixed;top:max(8px,env(safe-area-inset-top));right:8px;left:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none;z-index:5}
#lb{position:fixed;top:calc(max(8px,env(safe-area-inset-top)) + 40px);left:8px;background:rgba(16,24,48,.7);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:6px 10px;font-size:12px;min-width:120px;z-index:5;pointer-events:none;direction:rtl}
#lb b{display:block;margin-bottom:2px;color:#ffd35c}
#lb div{display:flex;justify-content:space-between;gap:8px}
#log{position:fixed;right:8px;bottom:calc(76px + env(safe-area-inset-bottom));width:min(60vw,320px);max-height:28vh;overflow:hidden;font-size:13px;pointer-events:none;z-index:5;display:flex;flex-direction:column;justify-content:flex-end;gap:3px}
#log div{background:rgba(16,24,48,.62);border-radius:10px;padding:3px 8px;width:fit-content;max-width:100%;word-break:break-word}
#log div i{font-style:normal;color:#7fd6ff;font-weight:700}
#bar{position:fixed;bottom:0;left:0;right:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;gap:4px;justify-content:center;flex-wrap:nowrap;overflow-x:auto;z-index:6;background:linear-gradient(transparent,rgba(10,16,34,.85))}
#bar{justify-content:flex-start!important}#bar .btn:first-child{margin-inline-start:auto}#bar .btn:last-child{margin-inline-end:auto}
@media(max-height:420px){#chatbox>div{display:none!important}#bar{padding-top:4px;padding-bottom:4px}#bar .btn{min-height:40px!important;padding-top:2px;padding-bottom:2px}}
@media(max-width:420px){#bar{gap:3px;padding-left:4px;padding-right:4px}#bar .btn{flex:1 1 0;min-width:0;padding:6px 2px;font-size:11px}#bar .btn span{font-size:18px}}
.btn{min-height:52px;flex:0 0 auto;border:0;border-radius:14px;padding:8px 6px;font:inherit;font-size:12px;font-weight:700;color:#fff;background:#3b5bdb;box-shadow:0 3px 0 rgba(0,0,0,.35);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:50px}
.btn span{font-size:20px;line-height:1}
.btn.g{background:#2f9e44}.btn.o{background:#e8590c}.btn.p{background:#9c36b5}.btn.r{background:#c92a2a}.btn.d{background:#495057}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn[hidden]{display:none}
#joy{position:fixed;left:18px;bottom:calc(92px + env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);z-index:5;display:none;touch-action:none}
#joy i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.55)}
@media (pointer:coarse){#joy{display:block}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#modal .card{background:#1b2340;border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:16px;width:min(440px,100%);max-height:88vh;overflow:auto;touch-action:pan-y}
#modal h2{margin:0 0 10px;font-size:19px}
#modal label{display:block;margin:10px 0 4px;font-size:13px;color:#aab4de}
#modal input[type=text]{width:100%;padding:10px;border-radius:10px;border:1px solid #445;background:#0f1530;color:#fff;font:inherit;font-size:16px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw b{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer;display:inline-block}
.sw b.on{border-color:#fff}
.sw u{text-decoration:none;padding:6px 10px;border-radius:10px;background:#2b3563;cursor:pointer;font-size:14px}
.sw u.on{background:#3b5bdb;outline:2px solid #fff}
.row{display:flex;gap:8px;margin-top:12px}
.row .btn{flex:1;flex-direction:row;justify-content:center;gap:6px}
.friend{display:flex;justify-content:space-between;align-items:center;background:#252e57;border-radius:10px;padding:8px 10px;margin-top:6px}
#shop{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:7;display:none;padding:6px 8px;background:rgba(10,16,34,.9);border-top:1px solid rgba(255,255,255,.15)}
#shopitems{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.it{flex:0 0 auto;background:#252e57;border-radius:12px;padding:6px 10px;text-align:center;font-size:12px;min-width:68px;cursor:pointer;border:2px solid transparent}
.it.on{border-color:#ffd35c}.it.no{opacity:.45}
.it span{display:block;font-size:22px}
#shoptools{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;align-items:center;font-size:13px}
#shoptools .btn{padding:6px 10px;min-width:0;flex-direction:row;font-size:13px}
#mm{position:fixed;right:8px;top:calc(max(8px,env(safe-area-inset-bottom)) + 44px);width:92px;height:92px;border-radius:50%;background:rgba(16,24,48,.6);border:1px solid rgba(255,255,255,.2);z-index:4;pointer-events:none}
.qrow{background:#252e57;border-radius:10px;padding:8px 10px;margin-top:6px;font-size:14px}.qbar{height:6px;border-radius:3px;background:#0f1530;margin-top:5px;overflow:hidden}.qbar i{display:block;height:100%;background:#51cf66}
#race{position:fixed;top:calc(max(8px,env(safe-area-inset-top)) + 140px);left:50%;transform:translateX(-50%);z-index:5;display:none;font-size:16px;font-weight:800;background:rgba(16,24,48,.8);border:1px solid #69db7c;color:#fff;border-radius:999px;padding:6px 16px;pointer-events:none}
#act{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:9;display:none;font-size:16px;padding:12px 18px;flex-direction:row;background:#f08c00}
#toast{position:fixed;top:30%;left:50%;transform:translateX(-50%);background:rgba(16,24,48,.92);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:10px 16px;z-index:30;display:none;max-width:86vw;text-align:center;font-size:15px;pointer-events:none}
#chatbox{position:fixed;left:8px;right:8px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:12;display:none;gap:6px}
#chatbox input{flex:1;padding:12px;border-radius:12px;border:1px solid #556;background:#0f1530;color:#fff;font:inherit;font-size:16px;min-width:0}
#emo{position:fixed;left:8px;right:8px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:12;display:none;justify-content:center;gap:6px;flex-wrap:wrap}
#emo b{font-size:28px;background:rgba(16,24,48,.85);border-radius:14px;padding:6px 10px;cursor:pointer}
#loading{position:fixed;inset:0;background:#101830;z-index:40;display:flex;align-items:center;justify-content:center;font-size:22px;flex-direction:column;gap:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><div class="pill" id="roomName">…</div><div class="pill" id="online">⚪ …</div><div class="pill" id="coins">🪙 0</div></div>
<div id="lb"></div>
<div id="race"></div>
<div id="log"></div>
<canvas id="mm" width="184" height="184"></canvas>
<div id="joy"><i></i></div>
<div id="shop"><div id="shoptools"></div><div id="shopitems"></div></div>
<div id="chatbox"><input id="chatin" type="text" maxlength="80" placeholder="اكتب رسالة…" autocomplete="off"><button class="btn g" id="chatsend" style="padding:8px 14px">إرسال</button></div>
<div id="emo"></div>
<div id="bar">
<button class="btn" id="bChat"><span>💬</span>دردشة</button>
<button class="btn o" id="bEmo"><span>😀</span>تفاعل</button>
<button class="btn p" id="bMe"><span>🎨</span>شكلي</button>
<button class="btn g" id="bHome"><span>🏠</span>بيتي</button>
<button class="btn" id="bVisit"><span>🔑</span>زيارة</button>
<button class="btn r" id="bEdit" hidden><span>🛋️</span>فرّش</button>
<button class="btn o" id="bQ"><span>🎯</span>مهام</button>
<button class="btn d" id="bInfo"><span>ℹ️</span>مساعدة</button>
</div>
<button class="btn" id="act"></button>
<div id="modal"><div class="card" id="mcard"></div></div>
<div id="toast"></div>
<div id="loading"><div>🌍</div><div>جاري تحميل عالمنا…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
<script src="game.js?v=105"></script>
<script src="game2.js?v=105"></script>
</body>
</html>
